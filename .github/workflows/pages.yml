name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/tax-savings-retirement-simulator-bxeilh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 끊지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 면 저장소에 Pages가 꺼져 있어도 API로 켜 준다.
      # 설정 화면을 손대지 않고 이 워크플로만으로 배포가 시작되는 이유.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # index.html이 저장소 루트에 있어 빌드 없이 통째로 올린다.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
