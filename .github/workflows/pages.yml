name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/tax-savings-retirement-simulator-bxeilh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # environment 를 참조하지 않는 잡에서 Pages를 먼저 켠다.
  # 켜기 전에는 github-pages 환경이 없어서, 이 잡을 나누지 않으면
  # 배포 잡이 시작 단계에서 거부된다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (없으면 켠다)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # index.html이 루트에 있는 정적 페이지라 빌드 없이 통째로 올린다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
